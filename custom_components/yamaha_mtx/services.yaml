set_crosspoint:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: yamaha_mtx
    source:
      required: true
      example: "CH 1"
      selector:
        select:
          mode: dropdown
          options:
            - "CH 1"
            - "CH 2"
            - "CH 3"
            - "CH 4"
            - "CH 5"
            - "CH 6"
            - "CH 7"
            - "CH 8"
            - "CH 9"
            - "CH 10"
            - "CH 11"
            - "CH 12"
            - "CH 13"
            - "CH 14"
            - "CH 15"
            - "CH 16"
            - "CH 17"
            - "CH 18"
            - "CH 19"
            - "CH 20"
            - "CH 21"
            - "CH 22"
            - "CH 23"
            - "CH 24"
            - "ST IN 1L"
            - "ST IN 1R"
            - "ST IN 2L"
            - "ST IN 2R"
            - "ST IN 3L"
            - "ST IN 3R"
            - "FX RTN 1L"
            - "FX RTN 1R"
            - "FX RTN 2L"
            - "FX RTN 2R"
    zone:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    level:
      required: false
      example: -10
      selector:
        number:
          min: -80
          max: 0
          step: 0.5
          unit_of_measurement: dB
          mode: slider
    enabled:
      required: false
      example: true
      selector:
        boolean:

send_command:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: yamaha_mtx
    command:
      required: true
      example: "get MTX:mem_512/60000/0/0/0/0/0 0 0"
      selector:
        text:
